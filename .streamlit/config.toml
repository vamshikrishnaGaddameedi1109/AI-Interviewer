[global]
developmentMode = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#3B82F6"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
font = "sans serif"

[server]
port = 3000
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"
